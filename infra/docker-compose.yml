services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: labflow
      POSTGRES_USER: labflow
      POSTGRES_PASSWORD: labflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labflow -d labflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: labflow
      MINIO_ROOT_PASSWORD: labflow-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  ai-service:
    build:
      context: ../apps/ai-service
    environment:
      LABFLOW_AI_MOCK_ENABLED: ${LABFLOW_AI_MOCK_ENABLED:-true}
      LABFLOW_AI_OPENAI_API_KEY: ${LABFLOW_AI_OPENAI_API_KEY:-}
      LABFLOW_AI_OPENAI_BASE_URL: ${LABFLOW_AI_OPENAI_BASE_URL:-https://api.openai.com/v1}
      LABFLOW_AI_OPENAI_MODEL: ${LABFLOW_AI_OPENAI_MODEL:-gpt-4o-mini}
      LABFLOW_AI_OPENAI_TEMPERATURE: ${LABFLOW_AI_OPENAI_TEMPERATURE:-1.0}
    ports:
      - "8000:8000"

  api:
    build:
      context: ../apps/api
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/labflow
      SPRING_DATASOURCE_USERNAME: labflow
      SPRING_DATASOURCE_PASSWORD: labflow
      AI_SERVICE_BASE_URL: http://ai-service:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: labflow
      MINIO_SECRET_KEY: labflow-secret
      MINIO_BUCKET: labflow
    ports:
      - "8080:8080"

  web:
    build:
      context: ../apps/web
      args:
        VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  minio-data:
